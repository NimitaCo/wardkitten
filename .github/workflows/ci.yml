name: CI

on:
  push:
    branches: [main, Release]
  pull_request:
    branches: [main, Release]

# Credenciales del feed privado NimitaCo (las lee nuget.config).
# Inerte mientras el repo no referencie paquetes Es.Nimita.*.
env:
  NIMITACO_NUGET_USER: ${{ github.actor }}
  NIMITACO_NUGET_TOKEN: ${{ secrets.NIMITACO_NUGET_TOKEN }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore wardkitten.slnx

      - name: Build
        run: dotnet build wardkitten.slnx -c Release --no-restore

      - name: Test
        run: dotnet test wardkitten.slnx -c Release --no-build --verbosity normal
