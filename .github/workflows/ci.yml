name: CI

on:
  push:
    branches: [main, Release]
  pull_request:
    branches: [main, Release]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # El contexto `secrets` no se permite en el `if` de un paso; se evalúa aquí (job env) y los
      # pasos condicionan sobre la variable. Así, sin NIMITACO_NUGET_TOKEN creado, NO se define
      # NuGetPackageSourceCredentials_nimitaco (una credencial vacía rompería el restore de NuGet).
      NIMITACO_TOKEN_PRESENT: ${{ secrets.NIMITACO_NUGET_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure NimitaCo feed credentials
        if: env.NIMITACO_TOKEN_PRESENT == 'true'
        run: echo "NuGetPackageSourceCredentials_nimitaco=Username=${{ github.actor }};Password=${{ secrets.NIMITACO_NUGET_TOKEN }}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore wardkitten.slnx

      - name: Build
        run: dotnet build wardkitten.slnx -c Release --no-restore

      - name: Test
        run: dotnet test wardkitten.slnx -c Release --no-build --verbosity normal
